<style>

.g{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.prompt{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px}

.annot.s-support .an-support{background:#fff2c6}.annot.s-expl .an-expl{background:#eadcfb}.annot.s-ex .an-ex{background:#ffe0c7}

.sw-intro{background:#eef0f4;border:1px solid #c9ced8}.sw-thesis{background:#dbe6ff}.sw-topic{background:#cdeeea}.sw-support{background:#fff2c6}.sw-expl{background:#eadcfb}.sw-ex{background:#ffe0c7}.sw-counter{background:#fbd7de}.sw-concl{background:#dfe7f0}

.opt{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font-size:14px;text-align:left}

.dd li{list-style:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff;display:flex;gap:8px;align-items:center;cursor:grab}

.fbitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.fbitem .o{font-family:'Source Serif 4',Georgia,serif;background:var(--soft);padding:4px 8px;border-radius:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;box-shadow:var(--sh);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.banner-demo{background:repeating-linear-gradient(135deg,#fff3e2 0 14px,#ffe9cc 14px 28px);border:1px solid #f3d6ad;color:#6d3605;border-radius:12px;padding:10px 14px;font-weight:600;font-size:13.5px}
.list-plain{list-style:none;padding:0;margin:0}.list-plain li{padding:8px 0;border-bottom:1px solid var(--line)}.list-plain li:last-child{border:none}
.sxs{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.sxs{grid-template-columns:1fr}}

.hide{display:none!important}
.pill-tog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.pill-tog button{border:none;background:#fff;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.pill-tog button[aria-pressed=true]{background:var(--navy);color:#fff}

<div class="app">
 <aside class="side" id="side" aria-label="Điều hướng chính">

<script>
/* ============ FL012H COURSE DATA (defaults; teacher edits are stored as overrides) ============ */
const BOOK = `Giáo trình FL012H Writing (Khoa Ngoại ngữ, ĐHCT, 2026)`;

const CLO = [
  {id:'CLO1', en:`Recognise the structure of formal and informal letters and the principles for developing a paragraph into a complete essay (advantage–disadvantage or argumentative).`, vi:`Nhận biết cấu trúc thư trang trọng/thân mật và nguyên tắc phát triển đoạn văn thành bài luận hoàn chỉnh.`},
  {id:'CLO2', en:`Use appropriate language, cohesive devices and accurate sentence structures to write letters and short essays on familiar topics in the VSTEP Level 3 format.`, vi:`Sử dụng ngôn ngữ, phương tiện liên kết và cấu trúc câu phù hợp để viết thư và bài luận ngắn theo định dạng VSTEP Bậc 3.`},
  {id:'CLO3', en:`Organise ideas logically and apply critical thinking when brainstorming, evaluating advantages/disadvantages and defending a viewpoint.`, vi:`Tổ chức ý logic, vận dụng tư duy phản biện khi lập ý, đánh giá lợi–hại và bảo vệ quan điểm.`},
  {id:'CLO4', en:`Value writing for future careers; show respect for sources (copyright), self-study, time management and teamwork.`, vi:`Nhận thức vai trò kỹ năng viết, tôn trọng bản quyền, phát triển kỹ năng tự học, quản lý thời gian và làm việc nhóm.`}
];

const PATHWAY = [
  {id:'diag', vi:'Viết chẩn đoán', en:'Diagnostic writing', weeks:[1]},
  {id:'found', vi:'Nền tảng câu & đoạn', en:'Language foundations', weeks:[1]},
  {id:'t1', vi:'Task 1 · Thư', en:'Task 1 · Letters', weeks:[2,3]},
  {id:'t2', vi:'Task 2 · Bài luận', en:'Task 2 · Essays', weeks:[4,5,6,7,8]},
  {id:'timed', vi:'Luyện viết tính giờ', en:'Timed practice', weeks:[5,7,8]},
  {id:'mock', vi:'Thi thử', en:'Mock test', weeks:[9]},
  {id:'refl', vi:'Tổng kết & phản tư', en:'Final reflection', weeks:[9]}
];

const KINDS = {
  input:{vi:'Kiến thức mới',en:'Input'}, language:{vi:'Ngôn ngữ',en:'Language'}, model:{vi:'Phân tích bài mẫu',en:'Model analysis'},
  guided:{vi:'Viết có hướng dẫn',en:'Guided writing'}, independent:{vi:'Viết độc lập',en:'Independent writing'},
  assessment:{vi:'Đánh giá',en:'Assessment'}, feedback:{vi:'Phản hồi & chỉnh sửa',en:'Feedback & revision'}
};
const ELEMENTS = [
  ['LO','Chuẩn đầu ra đo lường được','Measurable outcomes'],['content','Nội dung giảng dạy','Instructional content'],
  ['prewrite','Hoạt động trước khi viết','Pre-writing'],['lang','Hỗ trợ ngữ pháp & từ vựng','Grammar & vocabulary'],
  ['model','Bài mẫu có chú giải','Annotated models'],['guided','Viết có hướng dẫn','Guided writing'],
  ['independent','Viết độc lập','Independent writing'],['formative','Đánh giá quá trình & sửa lỗi','Formative feedback'],
  ['homework','Bài tập về nhà & tự học','Homework & self-study'],['monitor','GV theo dõi tiến độ','Teacher monitoring']
];

function P(t,kind,tags,out,content,act,lang,hw,mon,book,link){return {t,kind,tags,out,content,act,lang,hw,mon,book,link}}

const WEEKS = [
 {n:1, vi:`Định hướng VSTEP Writing, viết chẩn đoán, phát triển câu và đoạn`, en:`VSTEP Writing orientation, diagnostic writing, sentence & paragraph development`, focus:'found', periods:[
  P(`Course orientation: VSTEP Writing at a glance`,'input',['prewrite','formative'],
    [`Describe the format, length and timing of Writing Task 1 and Task 2.`,`Distinguish a Practice Score, a Teacher Score and an official VSTEP result.`,`Set two personal writing goals.`],
    `The test has **two tasks in 60 minutes**: Task 1 (letter/email, at least 120 words, about 20 minutes) and Task 2 (essay, at least 250 words, about 40 minutes). Responses are evaluated in terms of **Task Fulfillment, Organization, Vocabulary and Grammar**.\nTask 2 needs more argument development, organisation and language control, so Weeks 4–8 focus on it.\nScores on this website are formative practice scores — not official results.`,
    [`Pre-writing: think–pair–share on Unit 1 Activity 1 questions (Why/whom/how often do you write?)`,`Read the course description, expected outcomes and the test sample`,`Set two goals on “My progress”`],
    `Key terms: register, content point, thesis statement, topic sentence, coherence, cohesion.`,
    `Read the 9-week roadmap; set 2 goals in My progress.`,`Goals set; orientation opened.`,`Unit 1, pp. 2–6`,'dashboard'),
  P(`Diagnostic writing`,'assessment',['independent','formative'],
    [`Write a 120–150-word paragraph in 20 minutes without support.`,`Write a Task 1 letter of at least 120 words in 20 minutes.`,`Identify own strengths and difficulties.`],
    `The diagnostic shows your starting point. It is **not graded**, and it becomes the first piece of your portfolio for the before-and-after comparison in Week 9.`,
    [`Paragraph: introduce yourself or your plans for the future (20 min, independent, timed)`,`Task 1 diagnostic letter (20 min)`,`Reflection: three things I found difficult`],
    `—`,`Finish any diagnostic part not completed in class.`,`Diagnostic submissions (D1); baseline error categories.`,`Unit 1, Activity 2 (p. 3)`,'practice:diag'),
  P(`Sentence accuracy: fragments, run-ons, agreement`,'language',['lang','guided','formative'],
    [`Identify fragments, run-on sentences and comma splices.`,`Correct subject–verb agreement errors in own writing.`],
    `A sentence needs a subject and a finite verb and must express a complete idea. Vietnamese does not mark verbs for person or number, so **-s endings and agreement** are frequent error points.`,
    [`Error hunt in your own diagnostic text`,`Toolkit: subject–verb agreement exercise`,`Fix 8 sentences (fragment / run-on / comma splice)`],
    `Subject–verb agreement; sentence boundaries; full stop vs comma.`,`Correct 5 sentences from your diagnostic and log the errors.`,`Grammar exercise completion; SVA error frequency.`,`Unit 7, I. Sentence problems (pp. 82–88)`,'toolkit:g-sva'),

 {id:'g-cond', cat:'grammar', t:'Conditional sentences', en:`Real future: If + present, will + verb. Hypothetical: If + past, would/could + verb. Do not use will in the if-clause.`, vi:`Không dùng “will” trong mệnh đề if.`, ex:`If the government reduced taxes, more people would buy electric motorbikes.`, err:`If the government will reduce taxes, people buy more.`, fix:`If the government reduces taxes, people will buy more.`, q:{s:`If every student ___ a few hours, communities would benefit.`, o:[`contributes`,`contributed`,`will contribute`], a:1}},
 {id:'g-passive', cat:'grammar', t:'Passive voice', en:`be + past participle; use it when the action matters more than who does it — common in solutions and processes.`, vi:`Câu bị động: be + V3/ed.`, ex:`Stricter rules should be introduced to reduce plastic waste.`, err:`A new policy was introduce last year.`, fix:`A new policy was introduced last year.`, q:{s:`More bus lanes should ___ in the city centre.`, o:[`build`,`be built`,`be build`], a:1}},
 {id:'g-complex', cat:'grammar', t:'Complex sentences', en:`A complex sentence has a main clause and a dependent clause (because, although, when, if…). Use only ONE connector for one relationship.`, vi:`Lỗi chuyển di phổ biến: “Although…, but…” — chỉ dùng một liên từ.`, ex:`Although online courses are flexible, many students miss face-to-face contact.`, err:`Although it is expensive, but many people buy it.`, fix:`Although it is expensive, many people buy it.`, q:{s:`Choose the correct sentence.`, o:[`Because it rained, so we stayed home.`,`Because it rained, we stayed home.`], a:1}},
 {id:'g-parallel', cat:'grammar', t:'Parallel structures', en:`Items in a list or pair should have the same grammatical form.`, vi:`Các thành phần liệt kê phải cùng dạng ngữ pháp.`, ex:`Exercise helps people relax, stay healthy and improve their mood.`, err:`Exercise helps people relax, stay healthy and improving their mood.`, fix:`Exercise helps people relax, stay healthy and improve their mood.`, q:{s:`Volunteering teaches students to plan, ___ and lead.`, o:[`communicating`,`communicate`,`communication`], a:1}},
 {id:'g-common', cat:'grammar', t:'Fragments, run-ons, comma splices', en:`Every sentence needs a subject + finite verb and a complete idea. Join two sentences with a full stop, a connector or a semicolon — not just a comma.`, vi:`Câu thiếu thành phần, câu dính liền bằng dấu phẩy.`, ex:`Technology is useful because it saves time.`, err:`Technology is useful, it saves time.`, fix:`Technology is useful; it saves time. / Technology is useful because it saves time.`, q:{s:`Which is a complete sentence?`, o:[`Because many students work part-time.`,`Many students work part-time.`], a:1}},
 {id:'v-verbs', cat:'vocab', t:'Academic verbs', en:`contribute to, enhance, address, ensure, maintain, promote, reduce, encourage`, vi:`Động từ học thuật giúp diễn đạt chính xác hơn “make, do, get”.`, ex:`This policy could enhance the quality of education.`, err:`This policy will make better the quality of education.`, fix:`This policy will improve/enhance the quality of education.`, q:{s:`Universities should ___ the problem of student stress.`, o:[`address`,`make`,`do`], a:0}},
 {id:'v-topic', cat:'vocab', t:'Topic vocabulary: education & technology', en:`tuition fees, curriculum, practical skills, digital literacy, academic performance, distance learning`, vi:`Từ vựng chủ đề giáo dục và công nghệ.`, ex:`Part-time work may affect students' academic performance.`, err:`Students need to improve their study result.`, fix:`Students need to improve their academic performance.`, q:{s:`The university is updating its ___ to include more practical courses.`, o:[`curriculum`,`program schedule`,`study list`], a:0}},
 {id:'v-colloc', cat:'vocab', t:'Collocations', en:`make progress, pay attention, play a role, raise awareness, take measures, conduct research, meet the needs of`, vi:`Kết hợp từ tự nhiên trong tiếng Anh.`, ex:`Schools play an important role in raising awareness of plastic waste.`, err:`Students can do progress quickly.`, fix:`Students can make progress quickly.`, q:{s:`The government should ___ measures to reduce traffic jams.`, o:[`do`,`take`,`make`], a:1}},
 {id:'v-family', cat:'vocab', t:'Word families', en:`economy (n) – economic (adj) – economical (adj, saving money) – economically (adv); pollute – pollution – polluted`, vi:`Chọn đúng từ loại (danh/động/tính/trạng từ).`, ex:`Tourism brings economic benefits to local communities.`, err:`This is an economy problem.`, fix:`This is an economic problem.`, q:{s:`Air ___ is a serious problem in big cities.`, o:[`polluted`,`pollution`,`pollute`], a:1}},
 {id:'v-formal', cat:'vocab', t:'Formal / informal alternatives', en:`get → receive/obtain; a lot of → many/a large number of; kids → children; ask for → request; help → assist`, vi:`Chọn từ phù hợp văn phong.`, ex:`I would like to request further information.`, err:`I wanna get more info.`, fix:`I would like to receive more information.`, q:{s:`Formal: “We need ___ to finish the project.”`, o:[`a lot of help`,`considerable assistance`,`loads of help`], a:1}},
 {id:'v-bundles', cat:'vocab', t:'Lexical bundles', en:`on the other hand, as a result of, it is important to, one of the most, in terms of, the fact that`, vi:`Cụm từ cố định thường gặp trong văn học thuật.`, ex:`As a result of rapid urbanisation, traffic has increased.`, err:`In the other hand, it is expensive.`, fix:`On the other hand, it is expensive.`, q:{s:`___ the most important benefits is flexibility.`, o:[`One of`,`One`,`Some of`], a:0}},
 {id:'v-transfer', cat:'vocab', t:'Vietnamese–English transfer errors', en:`learn knowledge → gain/acquire knowledge; open/close the light → turn on/off; “Although…but”, “Because…so” → one connector only.`, vi:`Lỗi do dịch từ tiếng Việt sang tiếng Anh.`, ex:`Students can gain a great deal of knowledge at university.`, err:`Students can learn many knowledges at university.`, fix:`Students can gain a great deal of knowledge at university.`, q:{s:`At university, students ___ a lot of knowledge.`, o:[`learn`,`gain`,`study`], a:1}},
 {id:'f-opinion', cat:'frames', t:'Introducing an opinion', en:`Personally, I completely agree that… / I partly agree that…, but… / In my view, …`, vi:`Nêu quan điểm rõ ràng ở câu luận đề.`, ex:`Personally, I partly agree that online learning is effective, but it cannot fully replace classrooms.`, err:`In my opinion, I think that…`, fix:`In my opinion, … / I think that…`, q:{s:`Which is redundant?`, o:[`In my opinion, I think that…`,`In my view, …`], a:0}},
 {id:'f-reasons', cat:'frames', t:'Presenting reasons', en:`One of the main reasons is that… / This is because… / The main reason why… is that…`, vi:`Trình bày lý do.`, ex:`The main reason why students choose online courses is that they are flexible.`, err:`Because students need flexible time. (fragment)`, fix:`This is because students need a flexible schedule.`, q:{s:`One of the main reasons ___ that it saves time.`, o:[`are`,`is`,`be`], a:1}},
 {id:'f-examples', cat:'frames', t:'Providing examples', en:`For example, … / For instance, … / A clear example of this is… / such as + noun`, vi:`Đưa ví dụ cụ thể.`, ex:`For instance, many cafés in Can Tho now use paper straws.`, err:`For example as Ho Chi Minh City has many traffic jams.`, fix:`For example, Ho Chi Minh City has serious traffic jams.`, q:{s:`Many cities, ___ Hanoi and Ho Chi Minh City, face traffic jams.`, o:[`for example`,`such as`,`for instance,`], a:1}},
 {id:'f-contrast', cat:'frames', t:'Contrasting viewpoints', en:`While some people argue that…, others… / On the one hand…; on the other hand… / However, … / Although + clause / Despite + noun`, vi:`Đối lập quan điểm.`, ex:`Despite its high cost, studying abroad is popular.`, err:`Despite it is cheap, many people do not use the bus.`, fix:`Although it is cheap, … / Despite being cheap, …`, q:{s:`___ the heavy rain, the event continued.`, o:[`Although`,`Despite`,`However`], a:1}},
 {id:'f-causes', cat:'frames', t:'Describing causes', en:`One major cause of… is… / … is largely due to + noun / … because + clause`, vi:`Mô tả nguyên nhân.`, ex:`Obesity is largely due to unhealthy diets and lack of exercise.`, err:`Due to people use motorbikes, the air is polluted.`, fix:`Because people use motorbikes… / Due to the use of motorbikes…`, q:{s:`Traffic jams are mainly ___ the rapid increase in private vehicles.`, o:[`because`,`due to`,`so`], a:1}},
 {id:'f-effects', cat:'frames', t:'Explaining consequences', en:`As a result, … / This leads to + noun/V-ing / Consequently, … / This causes + object + to-infinitive`, vi:`Giải thích hệ quả.`, ex:`Long working hours can lead to stress and poor health.`, err:`This leads to people get sick.`, fix:`This leads to people getting sick. / This causes people to get sick.`, q:{s:`Lack of sleep can lead to ___.`, o:[`students feel tired`,`tiredness`,`tired`], a:1}},
 {id:'f-solutions', cat:'frames', t:'Suggesting solutions', en:`One effective solution would be to… / The government should… / It is essential that…`, vi:`Đề xuất giải pháp cụ thể.`, ex:`One effective solution would be to expand the public bus network.`, err:`The solution is government should do something.`, fix:`One solution is for the government to improve public transport.`, q:{s:`One effective solution would be ___ more bike lanes.`, o:[`build`,`to build`,`building of`], a:1}},
 {id:'f-conclude', cat:'frames', t:'Concluding an argument', en:`In conclusion, … / To sum up, although…, I believe… — summarise; do not add new ideas.`, vi:`Kết luận: tóm tắt, không thêm ý mới.`, ex:`In conclusion, although working from home has drawbacks, its benefits are greater.`, err:`In conclusion, … Another benefit is… (new idea)`, fix:`In conclusion, … (summary only)`, q:{s:`A conclusion should ___.`, o:[`introduce a new argument`,`summarise the main ideas`], a:1}},
 {id:'f-request', cat:'frames', t:'Making requests', en:`Could you please let me know…? / I would be grateful if you could… / I would appreciate it if…`, vi:`Đưa yêu cầu lịch sự (thư trang trọng).`, ex:`I would be grateful if you could send me the schedule.`, err:`Please tell me when does it start.`, fix:`Could you tell me when it starts?`, q:{s:`I would be grateful if you ___ me the details.`, o:[`can send`,`could send`,`send`], a:1}},
 {id:'f-complaint', cat:'frames', t:'Writing complaints', en:`I am writing to express my dissatisfaction with… / Unfortunately, … / I would therefore like you to…`, vi:`Phàn nàn lịch sự nhưng rõ ràng.`, ex:`I would therefore like you to refund the second payment.`, err:`I am very angry with your shop!!!`, fix:`I am writing to express my dissatisfaction with your service.`, q:{s:`Which is appropriate in a formal complaint?`, o:[`Your service is terrible!!!`,`I was disappointed with the service I received.`], a:1}},
 {id:'f-advice', cat:'frames', t:'Giving advice', en:`If I were you, I would… / You might want to… / It might be a good idea to… / Why don't you…?`, vi:`Đưa lời khuyên (thư thân mật).`, ex:`If I were you, I would look for a job on campus.`, err:`You should to find a job near campus.`, fix:`You should find a job near campus.`, q:{s:`If I ___ you, I would talk to your lecturer.`, o:[`am`,`were`,`will be`], a:1}}
];
const GRAM_PRACTICE = [
  {s:`Each of the students [have] a laptop.`, o:['have','has'], a:1},
  {s:`Although the course is expensive, [but] many people join it.`, o:['but','(nothing)'], a:1},
  {s:`If the city [will build] more parks, people will exercise more.`, o:['will build','builds'], a:1},
  {s:`Plastic waste is [serious problem] in many cities.`, o:['serious problem','a serious problem'], a:1},
  {s:`The new library [was open] last month.`, o:['was open','was opened'], a:1},
  {s:`Students [who they live] far from campus often spend a lot on transport.`, o:['who they live','who live'], a:1},
  {s:`Working long hours leads to [people feel] stressed.`, o:['people feel','stress'], a:1},
  {s:`I look forward to [meet] you soon.`, o:['meet','meeting'], a:1}
];
const VOC_PRACTICE = [
  ['___ progress',['make','do','take'],0],['___ attention to',['pay','give','make'],0],['___ an important role',['play','make','do'],0],
  ['___ awareness of',['raise','rise','grow'],0],['___ measures',['take','do','make'],0],['___ research',['conduct','make','play'],0],
  ['___ knowledge',['gain','learn','study'],0],['___ the needs of',['meet','satisfy with','reach'],0]
];

/* ---------- Rubric (teaching-oriented; not official VSTEP descriptors) ---------- */
const RUBRIC_DEFAULT = {scale:10, crit:[
  {id:'tf', en:'Task Fulfillment', vi:'Hoàn thành yêu cầu', w:25, d:{
    t1:{b1:`Covers all required points, some briefly; purpose mostly clear; register generally appropriate; about 120 words.`, b2:`Covers all points fully and relevantly; purpose clear; register consistently appropriate.`},
    t2:{b1:`Addresses the task with a position; development may be uneven; at least 250 words.`, b2:`Addresses all parts of the task; clear position maintained; ideas relevant and well supported.`}}},
  {id:'oc', en:'Organization', vi:'Tổ chức bài viết', w:25, d:{
    t1:{b1:`Recognisable letter format (greeting, opening, body, closing, sign-off); basic linking.`, b2:`Logical paragraphing; smooth transitions; format fully appropriate to purpose.`},
    t2:{b1:`Four paragraphs with thesis and topic sentences; basic connectors; some jumps in logic.`, b2:`Clear progression; topic sentences carry the argument; varied, accurate cohesive devices.`}}},
  {id:'vl', en:'Vocabulary', vi:'Từ vựng', w:25, d:{
    t1:{b1:`Adequate vocabulary for the situation; some repetition and word-choice errors that rarely impede meaning.`, b2:`Flexible, precise vocabulary including functional expressions; occasional slips.`},
    t2:{b1:`Adequate topic vocabulary; some repetition and word-form errors.`, b2:`Good range including collocations and less common items; few errors.`}}},
  {id:'ga', en:'Grammar', vi:'Ngữ pháp', w:25, d:{
    t1:{b1:`Mainly simple sentences with some complex ones; errors present but meaning clear.`, b2:`Mix of simple and complex sentences with good control.`},
    t2:{b1:`Simple and some complex sentences; errors do not usually block meaning.`, b2:`Wide range of structures; good control; errors rarely reduce clarity.`}}}
]};
const ERR_CATS = [['grammar','Ngữ pháp','Grammar'],['vocabulary','Từ vựng','Vocabulary'],['spelling','Chính tả','Spelling'],['punctuation','Dấu câu','Punctuation'],['cohesion','Liên kết','Cohesion'],['sentence structure','Cấu trúc câu','Sentence structure'],['register','Văn phong','Register'],['task relevance','Bám sát đề','Task relevance']];

const CHECK = {
  t1:[`I answered every question / required point.`,`Greeting and sign-off match the register.`,`One paragraph per main point; clear opening and closing.`,`Formal: no contractions or slang. Informal: friendly but accurate.`,`At least 120 words.`,`I checked verb forms, articles and punctuation.`],
  t2:[`My essay has four paragraphs (introduction, two body paragraphs, conclusion).`,`The thesis statement takes a clear position / answers the question.`,`Each body paragraph has a topic sentence.`,`Each main idea has explanation, reasons or examples.`,`I used connectors appropriately and synonyms to avoid repetition.`,`The conclusion summarises the main ideas (no new ideas).`,`At least 250 words; I checked grammar.`]
};
const FRAMES_ED = {
  t1:{formal:[`Dear Mr/Ms …, / Dear Sir or Madam,`,`I am writing to…`,`Thank you for your email regarding…`,`I would be grateful if you could…`,`Could you please let me know whether…?`,`I look forward to hearing from you.`,`Yours sincerely, / Yours faithfully,`],
      informal:[`Hi …, / Dear …,`,`Thanks for your letter — it was great to hear from you!`,`Guess what? …`,`If I were you, I would…`,`Why don't we…?`,`Write back soon!`,`Best wishes, / Take care,`]},
  t2:[`It is often argued that… / In recent years, …`,`Personally, I agree that… because… and…`,`While I agree that…, I believe that…`,`For a variety of reasons, … Firstly, … Secondly, …`,`Apart from…, I also believe that…`,`For example, … / For instance, …`,`As a result, … / This leads to…`,`Admittedly, …; however, …`,`In conclusion, …`]
};

<script>
'use strict';
/* =================== UTILITIES =================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let LANG=lsGet('fl012h:lang','vi');
const L=(vi,en)=>LANG==='en'?en:vi;
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fmtD=s=>{if(!s)return '—';const d=new Date(s.length<=10?s+'T00:00:00':s);if(isNaN(d))return esc(s);return d.toLocaleDateString(LANG==='en'?'en-GB':'vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})};
const fmtDT=s=>{if(!s)return '—';const d=new Date(s);return d.toLocaleString(LANG==='en'?'en-GB':'vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
const words=t=>{t=(t||'').trim();return t?t.split(/\s+/).length:0};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const r1=n=>n==null?'—':(Math.round(n*10)/10).toString();
function inl(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(s){if(!s)return '';let out='',list=false;for(const ln of esc(s).split('\n')){const m=ln.match(/^\s*[-•]\s+(.*)/);if(m){if(!list){out+='<ul>';list=true}out+='<li>'+inl(m[1])+'</li>'}else{if(list){out+='</ul>';list=false}if(ln.trim())out+='<p>'+inl(ln)+'</p>'}}if(list)out+='</ul>';return out}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(html){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)closeModal()});document.body.appendChild(bg);const f=bg.querySelector('input,textarea,select,button');if(f)f.focus()}
function closeModal(){const m=$('#modalBg');if(m)m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const shuffle=(a,seed=7)=>{a=a.slice();let s=seed;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* =================== STATE & STORAGE =================== */
const S={user:null,db:null,sample:null,dl:null,uid:null,teacher:false,cloud:'local',canWrite:false,profiles:{},pending:false,demoRole:lsGet('fl012h:demoRole','student'),viewAs:'auto',courseLoaded:false};
const st={route:'home',week:null,t1tab:'lesson',t2tab:'lesson',tkcat:'all',tkq:'',tkFocus:null,tTab:'overview',demo:false,tSel:null,cmsW:1,cmsP:1,fil:{from:addDays(today(),-13),to:today(),group:'',student:'',task:'',status:'',week:''},lastSub:null,pfA:'',pfB:'',act:{},aiBusy:false,t2filter:'',t2topic:''};
function defaultMe(){return {v:1,upd:0,profile:{name:'',code:'',group:''},done:{},opened:{},subs:[],drafts:{},goals:[],act:{},refl:[],brain:{}}}
function defaultCourse(){return {v:1,weeks:{},periods:{},supp:null,ann:[],asg:{},asgExtra:[],res:[],rubric:null,cfg:{startDate:'',curWeek:0,groups:[{id:'FL012H-01',code:''}],ai:true,aiAssessed:false}}}
let ME=defaultMe(), COURSE=defaultCourse(), MYFB={items:{}}, ALL={}, FBALL={};
const lkey=()=>'fl012h:me:'+(S.uid||'local');
let saveT=null,dirty=false,saving=false;
function saveMe(){ME.upd=Date.now();lsSet(lkey(),ME);dirty=true;clearTimeout(saveT);saveT=setTimeout(flushMe,2000)}
async function flushMe(){
  if(!S.db||!S.uid||!S.canWrite||saving||!dirty)return;
  const size=JSON.stringify(ME).length;
  if(size>240000){Object.values(ME.drafts).forEach(d=>{d.ver=(d.ver||[]).slice(-2)});if(JSON.stringify(ME).length>240000){toast(L('Hồ sơ của bạn gần đạt giới hạn lưu trữ (256 KB). Hãy báo giảng viên.','Your record is near the 256 KB storage limit. Please tell your teacher.'));return}}
  saving=true;dirty=false;
  try{await S.db.doc('subs/'+S.uid).set(clone(ME));setCloud('cloud')}
  catch(e){const c=e&&e.code;if(c==='invalid_argument'){S.canWrite=false;setCloud('local')}else if(c==='quota_exceeded'){toast(L('Dung lượng lưu trữ đã đầy. Hãy báo giảng viên.','Storage is full. Please tell your teacher.'))}else{dirty=true}}
  saving=false;if(dirty){clearTimeout(saveT);saveT=setTimeout(flushMe,4000)}
}
const Q={};
function qset(path,data){const prev=Q[path]||Promise.resolve();const p=prev.then(()=>S.db.doc(path).set(clone(data)));Q[path]=p.catch(()=>{});return p}
async function saveCourse(msg){
  if(S.db&&S.teacher){try{await qset('course/content',COURSE);toast(msg||L('Đã lưu và công bố cho sinh viên.','Saved and published.'))}catch(e){toast(L('Không lưu được: ','Could not save: ')+(e&&e.message||''))}}
  else{lsSet('fl012h:course',COURSE);toast((msg||L('Đã lưu.','Saved.'))+' '+L('(chế độ xem thử – chỉ trên trình duyệt này)','(preview mode – this browser only)'))}
  render();
}
function setCloud(s){S.cloud=s;const el=$('#cloudChip');if(el)el.outerHTML=cloudChip()}
function cloudChip(){
  const m={cloud:['ok',L('Đã đồng bộ đám mây','Synced to cloud')],connecting:['navy',L('Đang kết nối…','Connecting…')],local:['warn',L('Chỉ lưu trên trình duyệt này','Saved in this browser only')],offline:['warn',L('Chưa kết nối được – có thể chưa cập nhật','Cannot reach cloud yet')]}[S.cloud]||['warn',''];
  return `<span class="chip ${m[0]}" id="cloudChip" title="${esc(L('Trạng thái lưu dữ liệu','Data storage status'))}">● ${esc(m[1])}</span>`;
}
function logAct(f,n=1){const d=today();const a=ME.act[d]||(ME.act[d]={v:0,o:0,c:0,m:0,s:0});a[f]=(a[f]||0)+n;const keys=Object.keys(ME.act).sort();while(keys.length>150)delete ME.act[keys.shift()];saveMe()}

/* =================== COURSE ACCESSORS =================== */
const cfg=()=>COURSE.cfg;
function isTeacherView(){if(S.user)return S.teacher&&S.viewAs!=='student';return !window.FL_STANDALONE&&S.demoRole==='teacher'}
function getWeek(n){return Object.assign({},WEEKS[n-1],COURSE.weeks[n]||{})}
function getPeriod(w,p,forTeacher){const k='w'+w+'p'+p;const o=COURSE.periods[k];const base=WEEKS[w-1].periods[p-1];if(o&&(!o._draft||forTeacher))return Object.assign({},base,o);return Object.assign({},base)}
const supp=()=>COURSE.supp||SUPP_DEFAULT;
function asgList(all){return ASG_DEFAULT.map(a=>Object.assign({},a,COURSE.asg[a.id]||{})).concat(COURSE.asgExtra||[]).filter(a=>!a.deleted&&(all||a.pub!==false))}
const rubric=()=>COURSE.rubric||RUBRIC_DEFAULT;
function dueOf(a){if(a.due)return a.due;if(cfg().startDate&&a.week)return addDays(cfg().startDate,(a.week-1)*7+6);return null}
function revDueOf(a){if(a.revDue)return a.revDue;if(cfg().startDate&&a.rev)return addDays(cfg().startDate,(a.rev-1)*7+6);return null}
function currentWeek(){const c=cfg();if(c.curWeek)return c.curWeek;if(c.startDate){const w=Math.floor(dayDiff(c.startDate,today())/7)+1;return Math.max(1,Math.min(9,w))}return 1}

async function runAI(id){
  const s=ME.subs.find(x=>x.id===id);if(!s||!S.sample||st.aiBusy)return;
  if(!aiAllowedFor(s.asg)){toast(L('Phản hồi AI không áp dụng cho bài này.','AI feedback is not available for this task.'));return}
  st.aiBusy=true;render();
  const p=getPrompt(s.pid);
  const input=`You are a writing tutor for Vietnamese university students (non-English majors) preparing for VSTEP Writing (target CEFR B1, some aiming at B2).
Give FORMATIVE feedback only. Do NOT rewrite the whole text and do NOT give numeric scores or claim an official VSTEP level.
Assess against four teaching criteria: tf = Task Fulfillment, oc = Organization, vl = Vocabulary, ga = Grammar.
Return ONLY valid JSON with this shape:
{"overall":"2-3 sentences","criteria":[{"id":"tf","comment":"...","band":"below B1|B1|B1-B2|B2|above B2"},{"id":"oc",...},{"id":"vl",...},{"id":"ga",...}],
"strengths":["..."],"improvements":["..."],
"sentences":[{"original":"exact sentence or phrase copied from the text","category":"grammar|vocabulary|spelling|punctuation|cohesion|sentence structure|register|task relevance","issue":"short name of the problem","explanation":"why, in simple English (add a short Vietnamese gloss in brackets for key terms)","suggestion":"corrected version of that sentence only"}],
"priorities":["max 3 revision priorities, most important first"],
"readiness":{"estimate":"e.g. approaching B1 / B1 / B1-B2","confidence":"low|medium","note":"why this is uncertain"}}
Rules: max 8 sentence items; "original" must be copied exactly from the student's text; keep comments concise and encouraging; consider the ${s.task==='t1'?'letter format, register and required points':'thesis, four-paragraph organisation, development and cohesion'}.
TASK: ${s.task==='t1'?'Task 1 (letter/email, at least 120 words)':'Task 2 (essay, at least 250 words)'}
PROMPT: ${p.plain}
PRACTICE LEVEL CHOSEN BY STUDENT: ${s.level}
STUDENT TEXT (${s.words} words):
"""${s.text}"""`;
  try{
    let res;
    if(typeof S.sample.json==='function')res=await S.sample.json(input,{modelTier:'default'});
    else{const r=await S.sample(input,{modelTier:'default'});const m=(r.text||'').match(/\{[\s\S]*\}/);res=JSON.parse(m?m[0]:r.text)}
    if(typeof res==='string'){const m=res.match(/\{[\s\S]*\}/);res=JSON.parse(m?m[0]:res)}
    if(!res||typeof res!=='object')throw {message:'bad response'};
    s.ai=Object.assign({at:new Date().toISOString()},res);saveMe();
  }catch(e){
    const c=e&&e.code;toast(c==='not_granted'?L('Chưa được cấp quyền dùng AI.','AI access was not granted.'):c==='rate_limited'?L('Đã đạt giới hạn tạm thời. Hãy thử lại sau.','Rate limited. Try again later.'):L('Không nhận được phản hồi AI hợp lệ. Thử lại sau.','No valid AI feedback. Please try again later.'));
  }
  st.aiBusy=false;render();
}

}

/* =================== DIFF & CHARTS =================== */
function diffHTML(a,b){
  const A=(a||'').split(/(\s+)/),B=(b||'').split(/(\s+)/);const n=A.length,m=B.length;
  if(n*m>900000)return esc(b);
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out='';
  while(i<n&&j<m){if(A[i]===B[j]){out+=esc(A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){if(A[i].trim())out+='<del>'+esc(A[i])+'</del>';else out+=esc(A[i]);i++}else{if(B[j].trim())out+='<ins>'+esc(B[j])+'</ins>';else out+=esc(B[j]);j++}}
  while(i<n){out+=A[i].trim()?'<del>'+esc(A[i])+'</del>':esc(A[i]);i++}while(j<m){out+=B[j].trim()?'<ins>'+esc(B[j])+'</ins>':esc(B[j]);j++}
  return out;
}
function lineChart(series,max){
  const W=560,H=200,pl=30,pb=26,pt=10,pr=10;const all=series.flatMap(s=>s.pts);if(all.length<1)return '';
  const xs=all.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;const X=x=>pl+(x1===x0?0.5:(x-x0)/(x1-x0))*(W-pl-pr),Y=y=>pt+(1-y/max)*(H-pt-pb);
  let g='';for(let v=0;v<=max;v+=max/5){g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7ecf1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  const lines=series.map(s=>{const pts=s.pts.sort((a,b)=>a.x-b.x);return `<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`+pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${s.color}"><title>${esc(s.name)}: ${r1(p.y)} · ${fmtD(new Date(p.x).toISOString())}</title></circle>`).join('')}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L('Biểu đồ điểm theo thời gian','Score over time chart')}">${g}${lines}</svg><div class="row small">${series.map(s=>`<span class="row" style="gap:4px"><i style="width:12px;height:3px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function hbars(items){const mx=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div style="margin:6px 0"><div class="row between small"><span>${esc(i.label)}</span><b>${i.v}</b></div><div class="bar"><i style="width:${i.v/mx*100}%;background:${i.c||'var(--teal)'}"></i></div></div>`).join('')}
function colChart(items){const W=Math.max(300,items.length*34),H=150,mx=Math.max(1,...items.map(i=>i.v));const bw=(W-20)/items.length;return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H+24}" width="${W}" height="${H+24}" role="img" aria-label="chart">${items.map((it,k)=>{const h=it.v/mx*(H-16);return `<rect x="${10+k*bw+4}" y="${H-h}" width="${bw-8}" height="${h}" rx="4" fill="#0d7a76"><title>${esc(it.label)}: ${it.v}</title></rect><text x="${10+k*bw+bw/2}" y="${H-h-4}" text-anchor="middle">${it.v||''}</text><text x="${10+k*bw+bw/2}" y="${H+16}" text-anchor="middle">${esc(it.short||it.label)}</text>`}).join('')}</svg></div>`}

function errCounts(me,fb){
  const c={};ERR_CATS.forEach(([k])=>c[k]=0);
  (me.subs||[]).forEach(s=>{const f=(fb.items||{})[s.id];if(f&&f.tags)Object.entries(f.tags).forEach(([k,v])=>{if(c[k]!=null)c[k]+=Number(v)||0});if(s.ai&&!(f&&f.aiHidden))(s.ai.sentences||[]).forEach(x=>{const k=(x.category||'').toLowerCase();if(c[k]!=null)c[k]++})});
  return c;
}

/* =================== DEMO DATA =================== */
let DEMO=null;
function demoData(){
  if(DEMO)return DEMO;
  let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const start=cfg().startDate||addDays(today(),-35);const cw=Math.max(1,Math.min(9,Math.floor(dayDiff(start,today())/7)+1));
  const fam=['Nguyễn','Trần','Lê','Phạm','Huỳnh','Võ','Đặng','Bùi'],mid=['Thị','Văn','Minh','Ngọc','Hoàng','Thanh'],giv=['An','Bình','Châu','Dung','Giang','Hà','Khoa','Linh','Mai','Nam','Phúc','Quân','Thảo','Vy'];
  DEMO=Array.from({length:28},(_,i)=>{
    const eng=0.35+rnd()*0.65,me=defaultMe(),fb={items:{}};
    me.profile={name:'[Mô phỏng] '+fam[i%8]+' '+mid[i%6]+' '+giv[i%14],code:'B23'+String(10000+i*37).slice(-5),group:i<14?'FL012H-01':'FL012H-02'};
    for(let w=1;w<=Math.min(cw,9);w++)for(let p=1;p<=5;p++){if(rnd()<eng){const d=addDays(start,(w-1)*7+Math.floor(rnd()*6));if(d<=today()){me.opened[pk(w,p)]=d;if(rnd()<eng)me.done[pk(w,p)]=d}}}
    for(let k=0;k<dayDiff(start,today())+1;k++){const d=addDays(start,k);if(rnd()<eng*0.55){me.act[d]={v:1+Math.floor(rnd()*3),o:Math.floor(rnd()*3),c:Math.floor(rnd()*2),m:Math.floor(rnd()*35*eng),s:0}}}
    const mk=(asg,pid,task,week,parent)=>{const d=addDays(start,(week-1)*7+3+Math.floor(rnd()*3));if(d>today())return null;const sid='d'+i+asg+(parent?'r':'');const s={id:sid,pid,task,level:rnd()<0.75?'B1':'B2',mode:'independent',timed:true,mins:task==='t1'?20:40,used:null,text:L('(Bài viết mô phỏng — không có nội dung thật.)','(Simulated submission — no real text.)'),plan:'',words:task==='t1'?110+Math.floor(rnd()*70):220+Math.floor(rnd()*110),at:d+'T09:'+pad(Math.floor(rnd()*59))+':00.000Z',asg,parent:parent||null,root:parent||null,self:{tf:5+Math.floor(rnd()*4),oc:5+Math.floor(rnd()*4),vl:4+Math.floor(rnd()*4),ga:4+Math.floor(rnd()*4)},refl:'',ai:null};me.subs.push(s);me.act[d]=me.act[d]||{v:1,o:0,c:0,m:20,s:0};me.act[d].s++;
      if(rnd()<0.8){const b=3+eng*4;fb.items[sid]={scores:{tf:Math.round(b+rnd()*2),oc:Math.round(b+rnd()*1.5),vl:Math.round(b-0.5+rnd()*2),ga:Math.round(b-1+rnd()*2)},tags:{grammar:Math.floor(rnd()*6),vocabulary:Math.floor(rnd()*4),punctuation:Math.floor(rnd()*3),cohesion:Math.floor(rnd()*3),register:task==='t1'?Math.floor(rnd()*3):0,'sentence structure':Math.floor(rnd()*3),spelling:Math.floor(rnd()*2)},comment:'(Simulated comment)',status:rnd()<0.15?'resubmit':'graded',at:d+'T12:00:00.000Z'}}return sid};
    if(rnd()<0.95)mk('D1','diag','t1',1);
    if(rnd()<eng+0.2){const a=mk('A1','t1-02','t1',3);if(a&&rnd()<eng)mk('A1','t1-02','t1',4,a)}
    if(rnd()<eng)mk('P1','t2-07','t2',5);
    if(rnd()<eng+0.15){const a=mk('A2','t2-03','t2',6);if(a&&rnd()<eng)mk('A2','t2-03','t2',7,a)}
    if(rnd()<eng)mk('P2','t2-11','t2',7);
    return {uid:'demo-'+pad(i+1),name:me.profile.name,code:me.profile.code,group:me.profile.group,me,fb};
  });
  return DEMO;
}

function csvExport(k){

  else if(k==='weekly'){rows=[['week','sessions','periods_first_opened','periods_completed','submissions','revisions']];const W={};analytics(list).forEach(x=>{const w=weekOfDate(x.d)||x.d.slice(0,7);const o=W[w]||(W[w]=[0,0,0,0,0]);o[0]+=x.v;o[1]+=x.o;o[2]+=x.c;o[3]+=x.sb;o[4]+=x.rv});Object.entries(W).forEach(([w,o])=>rows.push([w,...o]))}
  else if(k==='students'){rows=[['name','student_id','class','periods_done','submissions_t1','submissions_t2','revisions','last_active','support_flags']];list.forEach(s=>{const ss=s.me.subs||[];const days=Object.keys(s.me.act||{}).sort();rows.push([s.name,s.code,s.group,doneCount(s.me),ss.filter(x=>x.task==='t1').length,ss.filter(x=>x.task==='t2').length,ss.filter(x=>x.parent).length,days[days.length-1]||'',supportFlags(s).join(' | ')])})}
  else{const ids=asgList(true).filter(a=>a.graded).map(a=>a.id);rows=[['name','student_id','class',...ids.flatMap(id=>[id+'_teacher_score',id+'_status']),'average_teacher_score','scale']];list.forEach(s=>{const ss=s.me.subs||[];const cells=ids.flatMap(id=>{const l=ss.filter(x=>x.asg===id);const v=l.map(x=>teacherTotal(s.fb.items[x.id])).filter(v=>v!=null);const last=l[l.length-1];return [v.length?r1(Math.max(...v)):'',last?subStatus(s.fb.items[last.id]):'missing']});rows.push([s.name,s.code,s.group,...cells,r1(avg(ss.map(x=>teacherTotal(s.fb.items[x.id])).filter(v=>v!=null))),R.scale])})}
  offerFile(`FL012H_${k}_${today()}${st.demo?'_SIMULATED':''}.csv`,toCSV(rows),'text/csv');
}

  asgSave(){$$('tr[data-asg]').forEach(tr=>{const id=tr.dataset.asg;const o={};$$('[data-f]',tr).forEach(i=>{const f=i.dataset.f;o[f]=i.type==='checkbox'?i.checked:i.type==='number'?(i.value?Number(i.value):null):i.value});if(ASG_DEFAULT.some(a=>a.id===id))COURSE.asg[id]=Object.assign({},COURSE.asg[id]||{},o);else{const x=COURSE.asgExtra.find(a=>a.id===id);if(x)Object.assign(x,o)}});saveCourse()},
  asgAdd(){const n=(COURSE.asgExtra||[]).length+1;COURSE.asgExtra=COURSE.asgExtra||[];COURSE.asgExtra.push({id:'H'+n,t:L('Bài tập về nhà ','Homework ')+n,task:'t2',week:currentWeek(),prompt:'',required:false,graded:true,rev:null,pub:true});render()},
  asgDel(el){const id=el.dataset.id;if(ASG_DEFAULT.some(a=>a.id===id))COURSE.asg[id]=Object.assign({},COURSE.asg[id]||{},{deleted:true});else COURSE.asgExtra=COURSE.asgExtra.filter(a=>a.id!==id);saveCourse(L('Đã xóa bài tập.','Assignment removed.'))},
  annAdd(){const t=$('#annT').value.trim(),b=$('#annB').value.trim();if(!t)return;COURSE.ann=COURSE.ann||[];COURSE.ann.unshift({id:newId(),title:t,body:b,pin:$('#annPin').checked,pub:$('#annPub').checked,at:new Date().toISOString()});saveCourse()},
  annDel(el){COURSE.ann.splice(Number(el.dataset.i),1);saveCourse()},
  annPubT(el){const a=COURSE.ann[el.dataset.i];a.pub=a.pub===false;saveCourse()},
  cmsEdit(el){st.cmsW=Number(el.dataset.w);st.cmsP=Number(el.dataset.p);st.tTab='content';go('teacher')},
  cmsSave(el){const w=st.cmsW,p=st.cmsP;const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    COURSE.weeks[w]={vi:$('#cw_vi').value,en:$('#cw_en').value};
    COURSE.periods[pk(w,p)]={t:$('#c_t').value,kind:$('#c_kind').value,out:lines('#c_out'),content:$('#c_content').value,act:lines('#c_act'),lang:$('#c_lang').value,hw:$('#c_hw').value,mon:$('#c_mon').value,book:$('#c_book').value,link:$('#c_link').value.trim(),tags:$('#c_tags').value.split(',').map(s=>s.trim()).filter(Boolean),res:lines('#c_res').map(l=>{const [t,u]=l.split('|').map(s=>s.trim());return u?{title:t,url:u}:{title:t,url:t}}).filter(r=>/^https?:\/\//.test(r.url)),_draft:el.dataset.pub!=='1'};
    saveCourse(el.dataset.pub==='1'?L('Đã công bố.','Published.'):L('Đã lưu bản nháp (SV chưa thấy).','Draft saved (not visible to students).'))},
  cmsPreview(){const w=st.cmsW,p=st.cmsP,k=pk(w,p);const keep=COURSE.periods[k];const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);COURSE.periods[k]={t:$('#c_t').value,kind:$('#c_kind').value,out:lines('#c_out'),content:$('#c_content').value,act:lines('#c_act'),lang:$('#c_lang').value,hw:$('#c_hw').value,mon:$('#c_mon').value,book:$('#c_book').value,link:$('#c_link').value};const h=perHTML(w,p,false);if(keep)COURSE.periods[k]=keep;else delete COURSE.periods[k];$('#cmsPrev').innerHTML=`<h3>${L('Xem trước (như SV thấy)','Preview (student view)')}</h3>`+h.replace('<details','<details open')},
  cmsReset(){delete COURSE.periods[pk(st.cmsW,st.cmsP)];saveCourse(L('Đã khôi phục mặc định.','Restored default.'))},
  suppSave(){COURSE.supp=$$('[data-supp]').map(d=>{const o={id:newId()};$$('[data-f]',d).forEach(i=>o[i.dataset.f]=i.type==='checkbox'?i.checked:i.value);return o});saveCourse()},
  suppAdd(){COURSE.supp=clone(supp());COURSE.supp.push({id:newId(),t:L('Bài mới','New lesson'),body:'',link:'',pub:false});render()},
  suppDel(el){COURSE.supp=clone(supp());COURSE.supp.splice(Number(el.dataset.i),1);saveCourse()},
  suppMv(el){COURSE.supp=clone(supp());const i=Number(el.dataset.i),j=i+Number(el.dataset.d);if(j<0||j>=COURSE.supp.length)return;[COURSE.supp[i],COURSE.supp[j]]=[COURSE.supp[j],COURSE.supp[i]];saveCourse(L('Đã sắp xếp lại.','Reordered.'))},
  resAdd(){const u=$('#r_u').value.trim();if(!/^https?:\/\//.test(u)){toast(L('Cần liên kết bắt đầu bằng https://','Link must start with https://'));return}COURSE.res=COURSE.res||[];COURSE.res.push({title:$('#r_t').value.trim()||u,url:u,week:Number($('#r_w').value)||null,desc:$('#r_d').value.trim()});saveCourse()},
  resDel(el){COURSE.res.splice(Number(el.dataset.i),1);saveCourse()},
  rbSave(){const R=clone(rubric());R.scale=Math.max(4,Number($('#rb_scale').value)||10);R.crit.forEach(c=>{c.en=$(`#rb_${c.id}_en`).value;c.vi=$(`#rb_${c.id}_vi`).value;c.w=Number($(`#rb_${c.id}_w`).value)||0;['t1','t2'].forEach(t=>['b1','b2'].forEach(b=>c.d[t][b]=$(`#rb_${c.id}_${t}_${b}`).value))});COURSE.rubric=R;saveCourse()},
  rbReset(){COURSE.rubric=null;saveCourse()},
  grpAdd(){collectGroups();COURSE.cfg.groups.push({id:'FL012H-0'+(COURSE.cfg.groups.length+1),code:''});render()},
  grpDel(el){collectGroups();COURSE.cfg.groups.splice(Number(el.dataset.i),1);render()},
  grpGen(el){collectGroups();COURSE.cfg.groups[el.dataset.i].code='FL'+Math.random().toString(36).slice(2,7).toUpperCase();render()},
  setSave(){collectGroups();const c=COURSE.cfg;c.startDate=$('#s_start').value;c.curWeek=Number($('#s_cw').value)||0;c.ai=$('#s_ai').checked;c.aiAssessed=$('#s_aiA').checked;DEMO=null;saveCourse()}
};
function collectGroups(){const g=$$('[data-grp]').map(r=>({id:$('[data-f=id]',r).value.trim(),code:$('[data-f=code]',r).value.trim()})).filter(x=>x.id);if($$('[data-grp]').length||!COURSE.cfg.groups)COURSE.cfg.groups=g}
function confirmEarly(){return true}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName==='INPUT'&&el.type==='checkbox'){f(el,e);return}e.preventDefault();f(el,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target)}});
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset.act;if(!a)return;
  const sel={gap(){st.act.gap=st.act.gap||{};st.act.gap[el.dataset.i]=el.value;render(true)},vp(){st.act.vp=st.act.vp||{};st.act.vp[el.dataset.i]=el.value;render()},planPick(){st.planT1=el.value;render()},olPick(){ME.brain.outline=Object.assign(ME.brain.outline||{},{pid:el.value});saveMe();render()},t2f(){st.t2filter=el.value;render()},t2t(){st.t2topic=el.value;render()},edPid(){ED.pid=el.value;if(ED.timed)ED.mins=getPrompt(ED.pid).mins;saveEd();render()},edAsg(){ED.asg=el.value;saveEd()},pfA(){st.pfA=el.value;render()},pfB(){st.pfB=el.value;render()},pfDiff(){st.pfDiff=el.checked;render()},pickGroup(){ME.profile.group=el.value;saveMe();render()},fil(){st.fil[el.dataset.k]=el.value;render()},cmsW(){st.cmsW=Number(el.value);render()},cmsP(){st.cmsP=Number(el.value);render()}}[a];
  if(sel){sel();return}
});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='edText')return edInput();
  if(k==='edPlan'){const d=draft();d.plan=el.value;d.at=new Date().toISOString();clearTimeout(edSaveT);edSaveT=setTimeout(saveMe,700);return}
  if(k==='edMins'){ED.mins=Math.max(5,Math.min(90,Number(el.value)||20));saveEd();return}
  if(k==='tkq'){st.tkq=el.value;clearTimeout(window._tkT);window._tkT=setTimeout(()=>{const pos=el.selectionStart;render(false,true);const n=$('[data-in=tkq]');if(n){n.focus();n.setSelectionRange(pos,pos)}},250);return}
  if(k==='prof'){ME.profile[el.dataset.k]=el.value;saveMe();return}
  if(k==='rw'){ME.brain.rw=ME.brain.rw||{};ME.brain.rw[el.dataset.i]=el.value;saveMe();return}
  if(k==='t2b'){ME.brain.t2b=ME.brain.t2b||{};ME.brain.t2b[el.dataset.k]=el.value;saveMe();return}
  if(k==='ol'){ME.brain.outline=ME.brain.outline||{pid:'t2-02'};ME.brain.outline[el.dataset.k]=el.value;saveMe();return}
  if(k==='pl1'){ME.brain.plan1=ME.brain.plan1||{};const p=ME.brain.plan1[el.dataset.p]=ME.brain.plan1[el.dataset.p]||{};p[el.dataset.k]=el.value;saveMe();return}
  if(k==='fil'){st.fil[el.dataset.k]=el.value;clearTimeout(window._fT);window._fT=setTimeout(()=>{el.blur();render()},600);return}
});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details.per'))return;const k=d.dataset.k;if(d.open){st.openK=k;if(!ME.opened[k]){ME.opened[k]=today()}logAct('o')}},true);
/* drag & drop for rearrange */
let dragI=null;
document.addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest('#ddList li');if(!li)return;dragI=[...li.parentNode.children].indexOf(li);e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragI))}catch(x){}});
document.addEventListener('dragover',e=>{const li=e.target.closest&&e.target.closest('#ddList li');if(!li)return;e.preventDefault();$$('#ddList li').forEach(x=>x.classList.remove('over'));li.classList.add('over')});
document.addEventListener('drop',e=>{const li=e.target.closest&&e.target.closest('#ddList li');if(!li||dragI==null)return;e.preventDefault();const to=[...li.parentNode.children].indexOf(li);const o=st.act.order;const [m]=o.splice(dragI,1);o.splice(to,0,m);dragI=null;st.act.orderRes='';render()});
window.addEventListener('beforeunload',()=>{lsSet(lkey(),ME)});

/* =================== CLOUD INIT =================== */
async function initCloud(){
  const cl=window.claude;if(!cl||typeof cl.use!=='function'){S.cloud='local';return}
  S.cloud='connecting';renderNav();setCloud('connecting');
  let user=null,db=null;
  try{[user,db]=await Promise.all([cl.use('user'),cl.use('db')])}catch(e){}
  try{S.sample=await cl.use('sample')}catch(e){S.sample=null}
  try{S.dl=await cl.use('downloads')}catch(e){S.dl=null}
  S.user=user;S.db=db;
  if(user){
    try{S.uid=await user.id()}catch(e){S.uid=null}
    try{S.teacher=!!(await user.canEdit())||!!(await user.isOwner())}catch(e){S.teacher=false}
    let cw=null;try{cw=await user.can('data.write')}catch(e){}
    S.canWrite=cw!==false;
  }
  // migrate local preview data into this user's key if empty
  if(S.uid){const mine=lsGet(lkey(),null);if(mine)ME=Object.assign(defaultMe(),mine)}
  if(!db){setCloud('local');render();return}
  const timer=setTimeout(()=>{if(S.cloud==='connecting')setCloud('offline')},10000);
  db.doc('course/content').onSnapshot(snap=>{clearTimeout(timer);if(snap.exists){COURSE=Object.assign(defaultCourse(),snap.data());COURSE.cfg=Object.assign(defaultCourse().cfg,COURSE.cfg||{})}S.courseLoaded=true;if(S.cloud!=='local')setCloud(S.uid&&S.canWrite?'cloud':'local');renderSnap()},()=>{clearTimeout(timer)});
  if(S.uid){
    try{const snap=await db.doc('subs/'+S.uid).get();if(snap.exists){const r=snap.data();if(!ME.upd||(r.upd||0)>=ME.upd)ME=Object.assign(defaultMe(),clone(r));else{dirty=true}}else if(ME.subs.length||Object.keys(ME.done).length)dirty=true}catch(e){}
    db.doc('fb/'+S.uid).onSnapshot(s=>{MYFB=s.exists?clone(s.data()):{items:{}};renderSnap()},()=>{});
    if(!S.canWrite)setCloud('local');else{setCloud('cloud');if(dirty)flushMe()}
  }else setCloud('local');
  if(S.teacher){
    db.collection('subs').onSnapshot(q=>{ALL={};q.docs.forEach(d=>{ALL[d.id]=d.data()});resolveNames(Object.keys(ALL));renderSnap()},()=>{});
    db.collection('fb').onSnapshot(q=>{FBALL={};q.docs.forEach(d=>{FBALL[d.id]=clone(d.data())});renderSnap()},()=>{});
  }
  if(!sessionStorage.getItem('fl012h:v')){try{sessionStorage.setItem('fl012h:v','1')}catch(e){}logAct('v')}
  render();
}
async function resolveNames(ids){if(!S.user||typeof S.user.profiles!=='function')return;const need=ids.filter(i=>!S.profiles[i]);if(!need.length)return;try{const ps=await S.user.profiles(need);need.forEach(i=>{if(ps&&ps[i])S.profiles[i]=ps[i]});renderSnap()}catch(e){}}

/* =================== BOOT =================== */
(function boot(){
  const local=lsGet('fl012h:me:local',null);if(local)ME=Object.assign(defaultMe(),local);
  const lc=lsGet('fl012h:course',null);if(lc){COURSE=Object.assign(defaultCourse(),lc);COURSE.cfg=Object.assign(defaultCourse().cfg,lc.cfg||{})}
  const fl=lsGet('fl012h:fball',null);if(fl){FBALL=fl;MYFB=fl.local||{items:{}}}
  if(!window.claude){ALL={local:ME}}
  document.documentElement.lang=LANG;
  const r=location.hash.slice(1);st.route=ROUTES.includes(r)?r:'home';
  if(!window.claude&&!sessionStorage.getItem('fl012h:v')){try{sessionStorage.setItem('fl012h:v','1')}catch(e){}const d=today();const a=ME.act[d]||(ME.act[d]={v:0,o:0,c:0,m:0,s:0});a.v++;lsSet(lkey(),ME)}
  render(true);
  initCloud();
})();
